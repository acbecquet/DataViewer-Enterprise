<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataViewer - v2.10 Sprint Tracker</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#9aa3b2; --dim:#6b7384;
    --done:#46a758; --ready:#1d9e75; --prog:#e0922a; --todo:#3784dd; --back:#6b7384; --resolved:#8a7ff0; --blocked:#e24b4a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --txt:#1c2430; --mut:#5a6370; --dim:#8a93a0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:4px}
  h1 small.prev{font-size:11.5px;color:var(--dim);margin-top:3px}
  .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
  .meta b{color:var(--txt);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--done)}
  section{margin:26px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 12px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .grid{display:grid;gap:10px}
  .ws{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
  .card .body{flex:1;min-width:0}
  .card .t{font-weight:600;font-size:14px}
  .card .n{color:var(--mut);font-size:12.5px;margin-top:3px}
  .ids{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
  .id{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .issues{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  table{width:100%;border-collapse:collapse}
  .tasks td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tasks tr:last-child td{border-bottom:0}
  .tasks .num{color:var(--dim);font-family:ui-monospace,monospace;width:34px}
  .tasks .nm{font-size:13.5px}
  .commits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .commits .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .commits .row:last-child{border-bottom:0}
  .sha{color:var(--prog)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  footer{margin-top:30px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DataViewer Enterprise — Sprint Tracker
      <small id="sprint"></small>
      <small class="prev" id="prevSprint"></small>
    </h1>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <h2>At a glance</h2>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Workstreams</h2>
    <div class="grid ws" id="ws"></div>
  </section>

  <section>
    <h2>Work-item task panels</h2>
    <div class="grid" id="taskPanels"></div>
  </section>

  <section>
    <h2>Work items (Plane)</h2>
    <div class="grid issues" id="issues"></div>
  </section>

  <section>
    <h2>Recent commits</h2>
    <div class="card commits" style="display:block" id="commits"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const COLORS={done:'var(--done)',ready:'var(--ready)',in_progress:'var(--prog)',todo:'var(--todo)',backlog:'var(--back)',resolved:'var(--resolved)',blocked:'var(--blocked)'};
const LABEL={done:'Done',ready:'Ready for release',in_progress:'In progress',todo:'To do',backlog:'Backlog',resolved:'Resolved',blocked:'Blocked'};
function pill(s){const c=COLORS[s]||'var(--back)';return `<span class="pill" style="background:${c}22;color:${c}">${LABEL[s]||s}</span>`;}

const DATA = {
  sprint: "v3.0 - TPM template v3 free-standing metric model · this sprint: Phase 0 (corpus harness) + Phase 1 (core model + schema-driven read path, zero behavior change)",
  branch: "worktree-tpm-template-v3-research (off main @ v2.10.0 9b2aa64)",
  prevSprint: "v2.10.0 - multi-user edit integrity (DV-25/28) + name-pinned plot colors (DV-26) + sensory annotated Save Plot (DV-27); shipped, tagged + on Synology 2026-07-23.",
  lastUpdated: "2026-07-23 - Phase 0 COMPLETE (Tasks 1-4): harness utils + tst_v3shadow parse-determinism baseline green over all 8 fixtures (best run 10/10, 0 skipped) + corpus contract/gitignore guard; every task double-reviewed (spec + quality). Phase 1 underway: Tasks 5-6 landed (model value types + TemplateSchema + builtin standard-v1, tst_v3model 7/7 green; real-template header aliases captured via two independent openpyxl probes); Tasks 7-9 done + reviewed. Task 10 shadow gate GREEN ON FIRST RUN: processFileV3 output byte-identical to the legacy parser across all 8 fixtures (tst_v3shadow 18/18, 0 skipped; independently reproduced by the spec reviewer), via positional column resolution for the strangler + per-block Cart/Project header-layout sniffing mirroring extractMetadata. Old-format fixture CI-lock landed (7168e99, proven non-vacuous by a deliberate red run; suite now 20/20 over 9 fixtures). Task 11 production flip + Task 12 wrap docs are executing now (full-suite gate + binary smoke in progress - not yet claimed green).",
  workstreams: [
    {name:"Phase 0 - golden corpus + harness", status:"done", note:"COMPLETE + double-reviewed. CorpusUtils + JsonDiff (the migration's referee, branch coverage locked) + tst_v3shadow determinism baseline (all 8 fixtures PASS; symmetric python-timeout skip guard traced safe) + corpus contract w/ public-repo gitignore guard. Known quirk flagged for later: ExcelReader 60s subprocess timeout flakes to SKIP under load.", ids:["V3-PH0"]},
    {name:"Phase 1 - core model + schema-driven read path", status:"in_progress", note:"Tasks 5-6 done (2efcefd/10087ea): MetricDef/MetricSeries/Sample + TemplateSchema + standard-v1 (both regime variants; aliases verified against the real Dec-2025 template, which is always per-row-regime). Next: ExcelReader grid accessor -> SchemaDrivenReader -> LegacyAdapter -> shadow gate -> flip (Tasks 7-12).", ids:["V3-PH1"]},
    {name:"Later phases (this sprint: design-frozen backlog)", status:"backlog", note:"Phase 2 write-back + _dve_schema manifest; Phase 3 DB long-format (measurements/metric_defs/sample_headers + migration, HIGHEST RISK - re-audit autosave region first); Phase 4 schema-driven UI/reports; Phase 5 custom-test enablement -> v3.0.0 release.", ids:["V3-PH2","V3-PH3","V3-PH4","V3-PH5"]},
  ],
  taskPanels: [
    {title:"Phase 0+1: corpus harness + core metric model (plan 2c78b59)", id:"V3-P01", tasks:[
      {n:1,  name:"Corpus enumeration utility (CorpusUtils + tst_v3harness) - 3 tests green (7a05e62)", status:"done"},
      {n:2,  name:"JSON deep-diff utility (JsonDiff, the shadow referee) - 6 tests green (b1e7ab0) + review fixes landed (ef233e1)", status:"done"},
      {n:3,  name:"Shadow harness baseline: all 8 fixtures deterministic, symmetric timeout guard (e3953fb + 0706481)", status:"done"},
      {n:4,  name:"Corpus README + public-repo gitignore guard (e99180b)", status:"done"},
      {n:5,  name:"Model value types: MetricDef / MetricSeries / Sample (2efcefd)", status:"done"},
      {n:6,  name:"TemplateSchema + builtin standard-v1, real-template aliases probed (10087ea) + review polish (5b92fd6)", status:"done"},
      {n:7,  name:"ExcelReader::currentSheetCells() typed-grid accessor - suite 16/16 (be9b253)", status:"done"},
      {n:8,  name:"SchemaDrivenReader: name-first matching + positional fallback (19011a8/b02d47c/237dfba) - double-reviewed", status:"done"},
      {n:9,  name:"LegacyAdapter: model -> SampleData lowering, extractMetadata-faithful incl. real power guard (efc0476) - reviewed", status:"done"},
      {n:10, name:"processFileV3 + shadow gate GREEN first run (3b19a86) + old_standard fixture lock proven non-vacuous by red run (7168e99): 20/20, 0 skipped - double-reviewed", status:"done"},
      {n:11, name:"Flip production to schema-driven path; legacy kept as referee; full suite green + smoke - IN FLIGHT", status:"in_progress"},
      {n:12, name:"Wrap-up: spec phase log + lessons", status:"todo"},
    ]},
  ],
  issues: [
    {id:"V3-PH0",title:"Phase 0: golden corpus + shadow/round-trip harness foundation",status:"done",note:"Tasks 1-4 complete + double-reviewed; determinism proven over all 8 fixtures; corpus contract guarded for the public repo."},
    {id:"V3-PH1",title:"Phase 1: core model + schema-driven read path (zero behavior change)",status:"in_progress",note:"Tasks 5-6 done (model types + standard-v1 schema, aliases verified against the real template). Gate ahead: empty old-vs-new JSON diff across fixtures+corpus, then production flip with legacy referee retained."},
    {id:"V3-PH2",title:"Phase 2: CellAddressMap write-back + _dve_schema manifest",status:"backlog",note:"Round-trip harness (parse->reconstruct->cell-diff) becomes the gate."},
    {id:"V3-PH3",title:"Phase 3: DB long-format (measurements/metric_defs/sample_headers + migration)",status:"backlog",note:"HIGHEST RISK. Migration rehearsal on prod-dump copy + two-client E2E are hard gates; re-audit DV-28 autosave region first."},
    {id:"V3-PH4",title:"Phase 4: schema-driven UI + reports; delete legacy structs",status:"backlog",note:"Cols::/ColIdx and FileResult adapters removed once all consumers read the model."},
    {id:"V3-PH5",title:"Phase 5: custom-test enablement + v3.0.0 release train",status:"backlog",note:"Manifest authoring via sidecar + template authoring guide."},
  ],
  commits: [
    {sha:"7168e99", msg:"test(v3): old-standardized fixture locks heating-tech drop + mirror legacy not-new branch"},
    {sha:"3b19a86", msg:"feat(v3): processFileV3 schema-driven path + shadow gate green over corpus (Phase 1)"},
    {sha:"efc0476", msg:"feat(v3): LegacyAdapter lowering model->SampleData (Phase 1 strangler shell)"},
    {sha:"237dfba", msg:"refactor(v3): honest collision comment + schema-width assert in SchemaDrivenReader"},
    {sha:"b02d47c", msg:"test(v3): strengthen alias test - assert data routes to the aliased series"},
    {sha:"19011a8", msg:"feat(v3): SchemaDrivenReader - name-first schema-driven block parsing (Phase 1)"},
    {sha:"be9b253", msg:"feat(v3): ExcelReader::currentSheetCells() typed-grid accessor (Phase 1)"},
    {sha:"5b92fd6", msg:"refactor(v3): derive schema flags in builder + lock aliases/aggregates with tests"},
    {sha:"10087ea", msg:"feat(v3): TemplateSchema + builtin standard-v1 (both regime variants) (Phase 1)"},
    {sha:"2efcefd", msg:"feat(v3): model value types - MetricDef/MetricSeries/Sample (Phase 1)"},
    {sha:"0706481", msg:"test(v3): review polish - skip wording, corpus-proof data tags, fixture hint"},
    {sha:"e99180b", msg:"docs(v3): corpus directory contract + public-repo gitignore guard (Phase 0)"},
    {sha:"e3953fb", msg:"test(v3): shadow harness baseline - parse determinism over corpus (Phase 0)"},
    {sha:"ef233e1", msg:"test(v3): review fixes - JsonDiff branch coverage + corpus recursion test + doc accuracy"},
    {sha:"b1e7ab0", msg:"test(v3): JSON deep-diff utility for shadow/round-trip harnesses (Phase 0)"},
    {sha:"7a05e62", msg:"test(v3): corpus enumeration utility + tst_v3harness suite (Phase 0)"},
    {sha:"2c78b59", msg:"docs(v3): Phase 0+1 implementation plan - corpus harness + core metric model"},
    {sha:"b239b33", msg:"docs(v3): TPM template v3 free-standing metric model - design spec"},
  ],
};

function render(){
  document.getElementById('sprint').textContent = DATA.sprint + "  ·  " + DATA.branch;
  const prevEl = document.getElementById('prevSprint');
  if (DATA.prevSprint) { prevEl.textContent = "Previous: " + DATA.prevSprint; prevEl.style.display = ''; }
  else { prevEl.style.display = 'none'; }
  document.getElementById('meta').innerHTML =
    `<b>Updated</b> ${DATA.lastUpdated}<br><span id="ago"></span>`;

  const all=[...DATA.issues];
  const c=(s)=>all.filter(i=>i.status===s).length;
  const doneN = c('done')+c('ready');
  document.getElementById('stats').innerHTML = [
    ['Done / ready', doneN, 'var(--done)'],
    ['In progress', c('in_progress'), 'var(--prog)'],
    ['To do', c('todo'), 'var(--todo)'],
    ['Backlog', c('backlog'), 'var(--back)'],
    ['Task-panel items', (()=>{const a=DATA.taskPanels.flatMap(p=>p.tasks);return a.filter(t=>t.status==='done').length+' / '+a.length;})(), 'var(--prog)'],
  ].map(([l,n,col])=>`<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('legend').innerHTML = Object.keys(LABEL).map(k=>
    `<span><i class="dot" style="background:${COLORS[k]}"></i>${LABEL[k]}</span>`).join('');

  document.getElementById('ws').innerHTML = DATA.workstreams.map(w=>
    `<div class="card"><div class="body"><div class="t">${w.name}</div><div class="n">${w.note}</div>
     <div class="ids">${w.ids.map(i=>`<span class="id">${i}</span>`).join('')}</div></div>${pill(w.status)}</div>`).join('');

  document.getElementById('taskPanels').innerHTML = DATA.taskPanels.map(p=>{
    const done = p.tasks.filter(t=>t.status==='done').length;
    const pct  = Math.round(100*done/p.tasks.length);
    const rows = p.tasks.map(t=>
      `<tr><td class="num">${t.n}</td><td class="nm">${t.name}</td><td style="text-align:right">${pill(t.status)}</td></tr>`).join('');
    return `<div class="card" style="display:block">
      <div class="t" style="margin-bottom:8px">${p.title} <span class="id">${p.id}</span>`+
      `<span style="float:right;color:var(--mut);font-weight:400">${done}/${p.tasks.length}</span></div>
      <div class="bar" style="margin:0 0 12px"><i style="width:${pct}%"></i></div>
      <table class="tasks"><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  document.getElementById('issues').innerHTML = DATA.issues.map(i=>
    `<div class="card"><div class="body"><div class="t"><span class="id">${i.id}</span> ${i.title}</div>
     <div class="n">${i.note}</div></div>${pill(i.status)}</div>`).join('');

  document.getElementById('commits').innerHTML = DATA.commits.map(c=>
    `<div class="row"><span class="sha">${c.sha}</span><span>${c.msg}</span></div>`).join('');

  document.getElementById('foot').innerHTML =
    'Snapshot regenerated by Claude Code after each completed task. Not auto-live — reload after a progress update. ' +
    'States mirror Plane + the local feature branch (not yet pushed / deployed).';

  const t0=Date.now();
  setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);
    document.getElementById('ago').textContent = 'page open '+ (s<60? s+'s': Math.floor(s/60)+'m')+' ago';},1000);
}
render();
</script>
</body>
</html>
