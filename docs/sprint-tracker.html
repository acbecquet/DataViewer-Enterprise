<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataViewer — v2.6.1 Sprint Tracker</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#9aa3b2; --dim:#6b7384;
    --done:#46a758; --ready:#1d9e75; --prog:#e0922a; --todo:#3784dd; --back:#6b7384; --resolved:#8a7ff0; --blocked:#e24b4a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --txt:#1c2430; --mut:#5a6370; --dim:#8a93a0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:4px}
  h1 small.prev{font-size:11.5px;color:var(--dim);margin-top:3px}
  .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
  .meta b{color:var(--txt);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--done)}
  section{margin:26px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 12px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .grid{display:grid;gap:10px}
  .ws{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
  .card .body{flex:1;min-width:0}
  .card .t{font-weight:600;font-size:14px}
  .card .n{color:var(--mut);font-size:12.5px;margin-top:3px}
  .ids{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
  .id{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .issues{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  table{width:100%;border-collapse:collapse}
  .tasks td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tasks tr:last-child td{border-bottom:0}
  .tasks .num{color:var(--dim);font-family:ui-monospace,monospace;width:34px}
  .tasks .nm{font-size:13.5px}
  .commits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .commits .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .commits .row:last-child{border-bottom:0}
  .sha{color:var(--prog)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  footer{margin-top:30px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DataViewer Enterprise — Sprint Tracker
      <small id="sprint"></small>
      <small class="prev" id="prevSprint"></small>
    </h1>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <h2>At a glance</h2>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Workstreams</h2>
    <div class="grid ws" id="ws"></div>
  </section>

  <section>
    <h2>Work-item task panels</h2>
    <div class="grid" id="taskPanels"></div>
  </section>

  <section>
    <h2>Work items (Plane)</h2>
    <div class="grid issues" id="issues"></div>
  </section>

  <section>
    <h2>Recent commits — feature/v2.6.1-responsive-ui</h2>
    <div class="card commits" style="display:block" id="commits"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const COLORS={done:'var(--done)',ready:'var(--ready)',in_progress:'var(--prog)',todo:'var(--todo)',backlog:'var(--back)',resolved:'var(--resolved)',blocked:'var(--blocked)'};
const LABEL={done:'Done',ready:'Ready for release',in_progress:'In progress',todo:'To do',backlog:'Backlog',resolved:'Resolved',blocked:'Blocked'};
function pill(s){const c=COLORS[s]||'var(--back)';return `<span class="pill" style="background:${c}22;color:${c}">${LABEL[s]||s}</span>`;}

const DATA = {
  sprint: "v2.6.1 internal → v2.7.0 on release · responsive-UI overhaul (Approach C)",
  branch: "feature/v2.6.1-responsive-ui (off v2.6.0 @ fae7fea)",
  prevSprint: "v2.6.0 — backlog batch (DV-11/17/19/21) + installer code-32 hotfix: built, tagged v2.6.0, pushed to main (5a10256) 2026-06-30; owner Synology-drop + dv15-rekey still pending.",
  lastUpdated: "2026-06-30 · VERSION: this is internal v2.6.1 (→ v2.7.0 only on owner-approved release; .pro bumped 2.6.0→2.6.1). All 20 plan tasks implemented; the --ui-stress gate is now honestly all_ok:true (28/28) after correcting its measurement + making the text-scale axis real (6ef6dbb) — no real clips. BUT the owner watched the live resize and flagged a real UX issue the clip-metric can't see: at <760 both docks HIDE entirely (Task 11), so their buttons are unreachable at narrow widths. Owner chose COLLAPSE-don't-hide → fixing Task 11 to keep Navigator+Notes reachable, then re-verify. Then no-mistakes + /impeccable.",
  workstreams: [
    {name:"Phase 1 — structural scroll net + ribbon fix", status:"done", note:"ScrollHost wraps every region (3 central pages, both docks, ribbon group-row) + window floor 480×360 + HiDPI PassThrough + the 'View Raw Data' ≤2-line/grow fix. tst_scrollhost/tst_ribbonlayout green; app -Werror clean.", ids:["UI-RESP"]},
    {name:"Phase 2 — text-scale + very-narrow", status:"done", note:"AppTheme lineUnit/controlHeight/em + ResponsiveLayout VeryNarrow(<760) + MainWindow auto-collapse both docks (1fc2df6, c73c898).", ids:["UI-RESP"]},
    {name:"Phase 3 — sweep + verification", status:"in_progress", note:"~50-site fixed→min sweep (reviewed APPROVED, 27f984b) + 5 dialog floors (80c6b69) DONE; tst_sizingsweep 4/0. Remaining: MainWindow test accessors, stabilize tst_responsivelayout (a pre-existing multi-slot segfault), the --ui-stress closed-loop harness, README.", ids:["UI-RESP"]},
    {name:"Post-impl — no-mistakes validation + /impeccable", status:"todo", note:"After T20: full release build + run --ui-stress as the closed-loop no-clip gate → no-mistakes dev/e2e validation pass → queued /impeccable pass to make the UI end-user-customizable (theming / fonts / layout).", ids:[]},
  ],
  taskPanels: [
    { title:"v2.6.1 · Responsive-UI plan (20 tasks)", id:"UI-RESP", tasks:[
      {n:1,name:"ScrollHost widget (TDD) — tst_scrollhost 5/0, reviewed APPROVED (6eeb582)",status:"done"},
      {n:2,name:"Wrap the 3 central-stack pages in ScrollHost (f267dd6)",status:"done"},
      {n:3,name:"Wrap Navigator+Notes docks + window floor 480×360 (54c0c87)",status:"done"},
      {n:4,name:"AppTheme lineUnit/controlHeight/em helpers (98d0058, tst_apptheme 3/0)",status:"done"},
      {n:5,name:"HiDPI fractional rounding → PassThrough in main.cpp (7e7a905)",status:"done"},
      {n:6,name:"Failing ribbon ≤2-line-wrap test — red (25e39d0)",status:"done"},
      {n:7,name:"Balanced wrap + grow-not-clip buttons = 'View Raw Data' fix — green (2e34597)",status:"done"},
      {n:8,name:"Font-derive RibbonGroup/RibbonWidget heights (2607ba8)",status:"done"},
      {n:9,name:"Horizontal ScrollHost on the ribbon group row (29806e7, tst_ribbonlayout 8/0)",status:"done"},
      {n:10,name:"ResponsiveLayout VeryNarrow (<760) breakpoint, TDD (1fc2df6)",status:"done"},
      {n:11,name:"MainWindow auto-collapse both docks at VeryNarrow (c73c898)",status:"done"},
      {n:12,name:"Failing sizing-sweep guard test — tst_sizingsweep (5bb187b)",status:"done"},
      {n:13,name:"Fixed→min sweep ~50 sites, 8 files — reviewed APPROVED (27f984b)",status:"done"},
      {n:14,name:"Dialog floors + ScrollHost wrap, 5 dialogs (80c6b69); tst_sizingsweep 4/0",status:"done"},
      {n:15,name:"Grep-verify no clip-prone fixed height on text widgets — CLEAN (+ missed ImageViewDialog button f9c3b5b)",status:"done"},
      {n:16,name:"MainWindow scrollHostFor/regionWidget test-support accessors (c64ba0d)",status:"done"},
      {n:17,name:"Stabilize tst_responsivelayout — FIXED via QPointer (root cause: dangling m_window; gdb-confirmed); suite 7/0, 10× clean (02a8ee8)",status:"done"},
      {n:18,name:"--ui-stress CLI flag skeleton (mirrors --self-test) (d2b3e6d)",status:"done"},
      {n:19,name:"Real --ui-stress harness — 28-case size×scale no-clip JSON + PNGs (89e4970); RAN full matrix, font-ordering correct",status:"done"},
      {n:20,name:"Document --ui-stress in the deployment README (787e5f7)",status:"done"},
      {n:21,name:"TRIAGE + fix --ui-stress: all 28/28 fails were HARNESS artifacts (mispaired need/vp, V-checked a horizontal-only host) + a dead text-scale axis (QSS font-size overrode setFont) — fixed the measurement (single-ScrollHost, per-axis) + made scale real; gate now honestly all_ok:true (6ef6dbb)",status:"done"},
      {n:22,name:"Dock UX fix (owner watched live resize): at <760 both docks fully HID → buttons unreachable; owner chose COLLAPSE-don't-hide → keep Navigator+Notes reachable (thin strip / re-open) instead of hiding, re-verify --ui-stress still green",status:"in_progress"},
    ]},
  ],
  issues: [
    {id:"UI-RESP",title:"Responsive-UI overhaul — any size/aspect/split-snap + text-scaling (internal v2.6.1 → v2.7.0 on release)",status:"in_progress",note:"Approach C. 15/20 plan tasks done + build-verified (Phase 1+2 complete; Phase 3 sweep + dialogs landed). ScrollHost universal scroll net + 480×360 floor + AppTheme font-metric sizing + ribbon ≤2-line/grow fix all in. Remaining: test accessors, stabilize tst_responsivelayout, the --ui-stress closed-loop harness, README. Then no-mistakes validation + an /impeccable customization pass."},
    {id:"DV-20",title:"🔴 PROD Postgres password committed in installer.iss (public repo)",status:"in_progress",note:"CARRIED OVER — pre-existing (since v2.0.3), critical. installer.iss carries the default DB password + host/port/db/user, publicly readable on GitHub. OWNER: rotate the NAS Postgres password ASAP (assume compromised); then replace the baked-in default + scrub git history (BFG/filter-repo)."},
  ],
  commits: [
    {sha:"6ef6dbb",msg:"fix(verify): correct --ui-stress no-clip measurement (single-ScrollHost pairing + per-axis + real font-scale) — 28/28 fails were harness artifacts; gate now all_ok:true"},
    {sha:"787e5f7",msg:"docs(verify): T20 document --ui-stress in the deployment README"},
    {sha:"89e4970",msg:"feat(verify): T19 real --ui-stress harness — 28-case size×scale no-clip JSON + PNGs (ran full matrix)"},
    {sha:"d2b3e6d",msg:"feat(verify): T18 --ui-stress / --ui-stress-out CLI flag skeleton"},
    {sha:"02a8ee8",msg:"fix(responsive): T17 stabilize tst_responsivelayout — m_window→QPointer (dangling-ptr root cause); suite 7/0"},
    {sha:"c64ba0d",msg:"feat(mainwindow): T16 scrollHostFor/regionWidget test-support accessors for --ui-stress"},
    {sha:"f9c3b5b",msg:"fix(responsive): T15 convert missed ImageViewDialog button setFixedHeight(28)→min — grep now clean"},
    {sha:"80c6b69",msg:"feat(responsive): T14 dialog floors + ScrollHost wrap (5 dialogs); tst_sizingsweep green"},
    {sha:"27f984b",msg:"refactor(responsive): T13 fixed→min sweep across panels (~50 sites, 8 files) — reviewed APPROVED"},
    {sha:"5bb187b",msg:"test(responsive): T12 failing sizing-sweep guard (dialog floor + growable controls)"},
    {sha:"c73c898",msg:"feat(responsive): T11 MainWindow auto-collapse both side docks at VeryNarrow"},
    {sha:"1fc2df6",msg:"feat(responsive): T10 ResponsiveLayout VeryNarrow(<760) breakpoint (TDD)"},
    {sha:"29806e7",msg:"feat(ribbon): T9 horizontal ScrollHost on the group row (tst_ribbonlayout 8/0)"},
    {sha:"2607ba8",msg:"feat(ribbon): T8 font-derive RibbonGroup/RibbonWidget heights"},
    {sha:"2e34597",msg:"feat(ribbon): T7 balanced ≤2-line wrap + grow-not-clip buttons — 'View Raw Data' fix (green)"},
    {sha:"25e39d0",msg:"test(ribbon): T6 pin ≤2-line wrap + button-fit invariant (red)"},
    {sha:"7e7a905",msg:"feat(hidpi): T5 setHighDpiScaleFactorRoundingPolicy PassThrough before QApplication"},
    {sha:"98d0058",msg:"feat(theme): T4 AppTheme lineUnit/controlHeight/em font-metric helpers (tst_apptheme 3/0)"},
    {sha:"54c0c87",msg:"feat(responsive): T3 wrap Navigator+Notes docks in ScrollHost + window floor 480×360"},
    {sha:"f267dd6",msg:"feat(responsive): T2 wrap the 3 central-stack pages in ScrollHost"},
    {sha:"6eeb582",msg:"feat(widgets): T1 ScrollHost universal scroll wrapper (TDD, tst_scrollhost 5/0)"},
    {sha:"c578911",msg:"docs(tracker): v2.7.0 plan written + under lavish review; installer hotfix on main"},
    {sha:"5bd5777",msg:"docs(v2.7.0): responsive-UI implementation plan (20 tasks, 3 phases) — ultracode workflow + critic-revised"},
    {sha:"7b4554d",msg:"fix(installer): stage python_bundle.zip via {tmp}, not {app} (code-32 hotfix) — also on main (746376b)"},
    {sha:"2315804",msg:"docs(v2.7.0): responsive-UI design spec (Approach C) + tracker"},
  ],
};

function render(){
  document.getElementById('sprint').textContent = DATA.sprint + "  ·  " + DATA.branch;
  const prevEl = document.getElementById('prevSprint');
  if (DATA.prevSprint) { prevEl.textContent = "Previous: " + DATA.prevSprint; prevEl.style.display = ''; }
  else { prevEl.style.display = 'none'; }
  document.getElementById('meta').innerHTML =
    `<b>Updated</b> ${DATA.lastUpdated}<br><span id="ago"></span>`;

  const all=[...DATA.issues];
  const c=(s)=>all.filter(i=>i.status===s).length;
  const doneN = c('done')+c('ready');
  document.getElementById('stats').innerHTML = [
    ['Done / ready', doneN, 'var(--done)'],
    ['In progress', c('in_progress'), 'var(--prog)'],
    ['To do', c('todo'), 'var(--todo)'],
    ['Backlog', c('backlog'), 'var(--back)'],
    ['Task-panel items', (()=>{const a=DATA.taskPanels.flatMap(p=>p.tasks);return a.filter(t=>t.status==='done').length+' / '+a.length;})(), 'var(--prog)'],
  ].map(([l,n,col])=>`<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('legend').innerHTML = Object.keys(LABEL).map(k=>
    `<span><i class="dot" style="background:${COLORS[k]}"></i>${LABEL[k]}</span>`).join('');

  document.getElementById('ws').innerHTML = DATA.workstreams.map(w=>
    `<div class="card"><div class="body"><div class="t">${w.name}</div><div class="n">${w.note}</div>
     <div class="ids">${w.ids.map(i=>`<span class="id">${i}</span>`).join('')}</div></div>${pill(w.status)}</div>`).join('');

  document.getElementById('taskPanels').innerHTML = DATA.taskPanels.map(p=>{
    const done = p.tasks.filter(t=>t.status==='done').length;
    const pct  = Math.round(100*done/p.tasks.length);
    const rows = p.tasks.map(t=>
      `<tr><td class="num">${t.n}</td><td class="nm">${t.name}</td><td style="text-align:right">${pill(t.status)}</td></tr>`).join('');
    return `<div class="card" style="display:block">
      <div class="t" style="margin-bottom:8px">${p.title} <span class="id">${p.id}</span>`+
      `<span style="float:right;color:var(--mut);font-weight:400">${done}/${p.tasks.length}</span></div>
      <div class="bar" style="margin:0 0 12px"><i style="width:${pct}%"></i></div>
      <table class="tasks"><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  document.getElementById('issues').innerHTML = DATA.issues.map(i=>
    `<div class="card"><div class="body"><div class="t"><span class="id">${i.id}</span> ${i.title}</div>
     <div class="n">${i.note}</div></div>${pill(i.status)}</div>`).join('');

  document.getElementById('commits').innerHTML = DATA.commits.map(c=>
    `<div class="row"><span class="sha">${c.sha}</span><span>${c.msg}</span></div>`).join('');

  document.getElementById('foot').innerHTML =
    'Snapshot regenerated by Claude Code after each completed task. Not auto-live — reload after a progress update. ' +
    'States mirror Plane + the local feature branch (not yet pushed / deployed).';

  const t0=Date.now();
  setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);
    document.getElementById('ago').textContent = 'page open '+ (s<60? s+'s': Math.floor(s/60)+'m')+' ago';},1000);
}
render();
</script>
</body>
</html>
