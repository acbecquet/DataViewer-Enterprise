<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataViewer - v2.10 Sprint Tracker</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#9aa3b2; --dim:#6b7384;
    --done:#46a758; --ready:#1d9e75; --prog:#e0922a; --todo:#3784dd; --back:#6b7384; --resolved:#8a7ff0; --blocked:#e24b4a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --txt:#1c2430; --mut:#5a6370; --dim:#8a93a0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:4px}
  h1 small.prev{font-size:11.5px;color:var(--dim);margin-top:3px}
  .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
  .meta b{color:var(--txt);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--done)}
  section{margin:26px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 12px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .grid{display:grid;gap:10px}
  .ws{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
  .card .body{flex:1;min-width:0}
  .card .t{font-weight:600;font-size:14px}
  .card .n{color:var(--mut);font-size:12.5px;margin-top:3px}
  .ids{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
  .id{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .issues{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  table{width:100%;border-collapse:collapse}
  .tasks td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tasks tr:last-child td{border-bottom:0}
  .tasks .num{color:var(--dim);font-family:ui-monospace,monospace;width:34px}
  .tasks .nm{font-size:13.5px}
  .commits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .commits .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .commits .row:last-child{border-bottom:0}
  .sha{color:var(--prog)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  footer{margin-top:30px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DataViewer Enterprise — Sprint Tracker
      <small id="sprint"></small>
      <small class="prev" id="prevSprint"></small>
    </h1>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <h2>At a glance</h2>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Workstreams</h2>
    <div class="grid ws" id="ws"></div>
  </section>

  <section>
    <h2>Work-item task panels</h2>
    <div class="grid" id="taskPanels"></div>
  </section>

  <section>
    <h2>Work items (Plane)</h2>
    <div class="grid issues" id="issues"></div>
  </section>

  <section>
    <h2>Recent commits</h2>
    <div class="card commits" style="display:block" id="commits"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const COLORS={done:'var(--done)',ready:'var(--ready)',in_progress:'var(--prog)',todo:'var(--todo)',backlog:'var(--back)',resolved:'var(--resolved)',blocked:'var(--blocked)'};
const LABEL={done:'Done',ready:'Ready for release',in_progress:'In progress',todo:'To do',backlog:'Backlog',resolved:'Resolved',blocked:'Blocked'};
function pill(s){const c=COLORS[s]||'var(--back)';return `<span class="pill" style="background:${c}22;color:${c}">${LABEL[s]||s}</span>`;}

const DATA = {
  sprint: "v2.10 (desktop sprint: DV-25/28 multi-user edit integrity + DV-26 color pinning + DV-27 sensory annotated export) · internal builds v2.9.x → deployable v2.10.0",
  branch: "feature/v2.10 (off main @ 130c90a = app v2.8.0)",
  prevSprint: "v2.9 - service-only (DV-21 mobile web form + DV-23 NOTIFY-storm DB guard), live on the NAS, app stayed 2.8.0; merged to main 2026-07-16, no tag.",
  lastUpdated: "2026-07-16 - Phase 1 (DV-25 + DV-28) IMPLEMENTED and committed on feature/v2.10 (8 TDD tasks, 992cd2d..fbb8a25). Full Qt Test suite green (54 suites, 0 failed); the two-client stale-whole-save revert was demonstrated red (XFAIL) then green (scenario12 sensory / scenario13 detailed); scenario14 pins the no-op gate via a ctid probe; scenario15/16 are per-field flip guards. App release build is -Werror clean, release/DataViewer.exe FileVersion 2.9.1.0. PENDING (owner-gated): the v2.9.1 installer packaging is blocked because a template is open in Excel (locks it from ISCC - close it, then build_installer.bat), then the owner two-machine smoke test, then DV-25/DV-28 -> Ready for Release in Plane.",
  workstreams: [
    {name:"Multi-user edit integrity (DV-25 + DV-28)", status:"ready", note:"Phase 1 DONE + green + committed (992cd2d repro, 19afa01 needsSave, 3e7c5dd sensory merge, 6ae202b detailed merge, f9a602d producers, 0225884 gate, 5bf8037 flip guard). Layer 1 = per-session dirty gate on all 4 save loops (DV-28); Layer 2 = merge arbitrates ALL per-cell sample fields DB-authoritative-unless-dirty in both panels (DV-25). -Werror clean; full suite green. AWAITING: v2.9.1 installer packaging (blocked by an Excel template lock) + owner two-machine smoke test before Plane move.", ids:["DV-25","DV-28"]},
    {name:"Plot polish (DV-26 + DV-27)", status:"todo", note:"Phase 2 = DV-27 (sensory Save Plot appends per-sample note blocks below the chart; mirror DV-22's composeAnnotatedExport). Phase 3 = DV-26 (pin series color to sample NAME across sensory + TPM + reports; stable name-to-index mapping over AppTheme::seriesColor, no hashing). Not started - Phase 1 must clear the exit gate first.", ids:["DV-26","DV-27"]},
    {name:"Release v2.10.0", status:"todo", note:"C++ sprint -> real desktop release. Internal builds ride v2.9.x patches (this build = v2.9.1); wraps to deployable v2.10.0 (VERSION bump + clean rebuild + installer + self-test) at Phase 4, then the OWNER drops it on Synology (agent never touches the NAS).", ids:["DV-25","DV-26","DV-27","DV-28"]},
  ],
  taskPanels: [
    {title:"Multi-user sample-name revert", id:"DV-25", tasks:[
      {n:1, name:"E2E repro (scenario12 sensory + scenario13 detailed): A streams name/comments/voltage per-cell, stale B whole-saves - demonstrated red as XFAIL (992cd2d)", status:"done"},
      {n:2, name:"Spec + plan the fix (master spec 18bc39d + Phase 1 plan, owner-approved)", status:"done"},
      {n:3, name:"Merge arbitrates ALL per-cell sample fields DB-authoritative-unless-dirty - sensory (3e7c5dd) + detailed (6ae202b); record every dirty cell; block name/comments on load", status:"done"},
      {n:4, name:"red->green proven: scenario12/13 pass outright; 8 pure merge tests + 2 updated pre-DV-25 guards", status:"done"},
      {n:5, name:"Full suite green (54, 0 failed) + -Werror release build clean (DataViewer.exe 2.9.1.0)", status:"done"},
      {n:6, name:"v2.9.1 installer + owner two-machine smoke test -> Ready for Release in Plane", status:"ready"},
    ]},
    {title:"Autosave per-session change check", id:"DV-28", tasks:[
      {n:1, name:"needsSave helpers + per-session dirty flag (both structs), unit-tested (19afa01); scenario14 ctid gate contract", status:"done"},
      {n:2, name:"Dirty producers cover every path - edits/imports/recovery/props/images mark, loads stay clean (f9a602d)", status:"done"},
      {n:3, name:"Gate all 4 whole-session save loops on needsSave; clear dirty on Success (0225884)", status:"done"},
      {n:4, name:"Save-path regression sweep green (full suite) + flip guards scenario15/16 (5bf8037)", status:"done"},
      {n:5, name:"v2.9.1 installer + owner smoke (edit/save/close/recovery) -> Ready for Release", status:"ready"},
    ]},
    {title:"Color pinned to sample name (sensory + TPM + reports)", id:"DV-26", tasks:[
      {n:1, name:"Design the stable name->color mapping layer over AppTheme::seriesColor (union of loaded sample names; no repeats - no hashing; define scope/lifetime of the map)", status:"todo"},
      {n:2, name:"TDD the mapping: stable across sample-order permutations + file sets; all colors distinct", status:"todo"},
      {n:3, name:"Wire sensory: RadarChartWidget draw paths", status:"todo"},
      {n:4, name:"Wire TPM: PlotWidget/PlotEngine series + bar colors", status:"todo"},
      {n:5, name:"Wire reports: ReportGenerator + PlotEngine chart images (same mapping feeds both)", status:"todo"},
      {n:6, name:"Closed-loop visual verification (screenshot harness) + owner eyeball", status:"todo"},
    ]},
    {title:"Sensory annotated Save Plot (notes below chart)", id:"DV-27", tasks:[
      {n:1, name:"Design the notes strip: one block per selected sample ('Sample x - <note>'), 8pt, tight margins, wraps, zero overlap; covers multi-select + test-averages view", status:"todo"},
      {n:2, name:"TDD the composition: block count, wrap/geometry, no-overlap invariant (reuse DV-22 composeAnnotatedExport patterns)", status:"todo"},
      {n:3, name:"Implement + wire into SensoryPanel::onSaveChart", status:"todo"},
      {n:4, name:"Verify: tests green + screenshot harness + owner eyeball of a real export", status:"todo"},
    ]},
  ],
  issues: [
    {id:"DV-25",title:"Multi-user sensory: sample-name edit reverts (nobody can rename)",status:"ready",note:"Phase 1 fix DONE + green + committed (feature/v2.10). The read-merge-write now arbitrates every per-cell sample field DB-authoritative-unless-dirty in both sensory and detailed panels; the stale-whole-save revert is fixed (scenario12/13 red->green). AWAITING v2.9.1 installer + owner two-machine smoke test before Ready for Release."},
    {id:"DV-28",title:"Sensory autosave re-saves all sessions unconditionally - per-session change check",status:"ready",note:"Phase 1 fix DONE + green + committed. All 4 whole-session save loops now skip unchanged persisted sessions (per-session needsSave gate); scenario14 proves a clean session issues NO UPDATE (ctid stable). AWAITING owner smoke test."},
    {id:"DV-26",title:"Plot color pinned to sample name",status:"todo",note:"Owner scoped: sensory + TPM + reports. Stable name->index mapping layer over AppTheme::seriesColor; no hash-to-color (distinct-colors rule)."},
    {id:"DV-27",title:"Sensory Save Plot: notes section below the chart",status:"todo",note:"Per-sample note blocks under the exported image, 8pt, no overlap, incl. multi-select + test-averages. Mirrors DV-22's TPM annotated export."},
  ],
  commits: [
    {sha:"fbb8a25", msg:"build(v2.9.1): bump VERSION + exclude Excel ~$ lock files from the installer"},
    {sha:"5bf8037", msg:"test(DV-25): flip guard - dirty local edits survive whole-save for every arbitrated field"},
    {sha:"0225884", msg:"fix(DV-28): gate all four whole-session save loops on needsSave"},
    {sha:"f9a602d", msg:"feat(DV-28): per-session dirty producers - edits/imports/recovery/props/images mark, loads clean"},
    {sha:"6ae202b", msg:"fix(DV-25): detailed-sensory merge arbitrates name/comments, record their dirty cells"},
    {sha:"3e7c5dd", msg:"fix(DV-25): sensory merge arbitrates ALL per-cell sample fields, record their dirty cells"},
    {sha:"19afa01", msg:"feat(DV-28): per-session dirty flag + pure needsSave helpers (both panels)"},
    {sha:"992cd2d", msg:"test(DV-25): repro - stale whole-save reverts per-cell name/comments/voltage (XFAIL)"},
    {sha:"18bc39d", msg:"docs(v2.10): master spec - north star for DV-25/28/26/27, phased cadence, release plan"},
  ],
};

function render(){
  document.getElementById('sprint').textContent = DATA.sprint + "  ·  " + DATA.branch;
  const prevEl = document.getElementById('prevSprint');
  if (DATA.prevSprint) { prevEl.textContent = "Previous: " + DATA.prevSprint; prevEl.style.display = ''; }
  else { prevEl.style.display = 'none'; }
  document.getElementById('meta').innerHTML =
    `<b>Updated</b> ${DATA.lastUpdated}<br><span id="ago"></span>`;

  const all=[...DATA.issues];
  const c=(s)=>all.filter(i=>i.status===s).length;
  const doneN = c('done')+c('ready');
  document.getElementById('stats').innerHTML = [
    ['Done / ready', doneN, 'var(--done)'],
    ['In progress', c('in_progress'), 'var(--prog)'],
    ['To do', c('todo'), 'var(--todo)'],
    ['Backlog', c('backlog'), 'var(--back)'],
    ['Task-panel items', (()=>{const a=DATA.taskPanels.flatMap(p=>p.tasks);return a.filter(t=>t.status==='done').length+' / '+a.length;})(), 'var(--prog)'],
  ].map(([l,n,col])=>`<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('legend').innerHTML = Object.keys(LABEL).map(k=>
    `<span><i class="dot" style="background:${COLORS[k]}"></i>${LABEL[k]}</span>`).join('');

  document.getElementById('ws').innerHTML = DATA.workstreams.map(w=>
    `<div class="card"><div class="body"><div class="t">${w.name}</div><div class="n">${w.note}</div>
     <div class="ids">${w.ids.map(i=>`<span class="id">${i}</span>`).join('')}</div></div>${pill(w.status)}</div>`).join('');

  document.getElementById('taskPanels').innerHTML = DATA.taskPanels.map(p=>{
    const done = p.tasks.filter(t=>t.status==='done').length;
    const pct  = Math.round(100*done/p.tasks.length);
    const rows = p.tasks.map(t=>
      `<tr><td class="num">${t.n}</td><td class="nm">${t.name}</td><td style="text-align:right">${pill(t.status)}</td></tr>`).join('');
    return `<div class="card" style="display:block">
      <div class="t" style="margin-bottom:8px">${p.title} <span class="id">${p.id}</span>`+
      `<span style="float:right;color:var(--mut);font-weight:400">${done}/${p.tasks.length}</span></div>
      <div class="bar" style="margin:0 0 12px"><i style="width:${pct}%"></i></div>
      <table class="tasks"><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  document.getElementById('issues').innerHTML = DATA.issues.map(i=>
    `<div class="card"><div class="body"><div class="t"><span class="id">${i.id}</span> ${i.title}</div>
     <div class="n">${i.note}</div></div>${pill(i.status)}</div>`).join('');

  document.getElementById('commits').innerHTML = DATA.commits.map(c=>
    `<div class="row"><span class="sha">${c.sha}</span><span>${c.msg}</span></div>`).join('');

  document.getElementById('foot').innerHTML =
    'Snapshot regenerated by Claude Code after each completed task. Not auto-live — reload after a progress update. ' +
    'States mirror Plane + the local feature branch (not yet pushed / deployed).';

  const t0=Date.now();
  setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);
    document.getElementById('ago').textContent = 'page open '+ (s<60? s+'s': Math.floor(s/60)+'m')+' ago';},1000);
}
render();
</script>
</body>
</html>
