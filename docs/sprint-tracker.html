<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataViewer - v2.9 Sprint Tracker</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#9aa3b2; --dim:#6b7384;
    --done:#46a758; --ready:#1d9e75; --prog:#e0922a; --todo:#3784dd; --back:#6b7384; --resolved:#8a7ff0; --blocked:#e24b4a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --txt:#1c2430; --mut:#5a6370; --dim:#8a93a0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:4px}
  h1 small.prev{font-size:11.5px;color:var(--dim);margin-top:3px}
  .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut)}
  .meta b{color:var(--txt);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--done)}
  section{margin:26px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 12px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .grid{display:grid;gap:10px}
  .ws{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
  .card .body{flex:1;min-width:0}
  .card .t{font-weight:600;font-size:14px}
  .card .n{color:var(--mut);font-size:12.5px;margin-top:3px}
  .ids{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
  .id{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .issues{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  table{width:100%;border-collapse:collapse}
  .tasks td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tasks tr:last-child td{border-bottom:0}
  .tasks .num{color:var(--dim);font-family:ui-monospace,monospace;width:34px}
  .tasks .nm{font-size:13.5px}
  .commits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .commits .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .commits .row:last-child{border-bottom:0}
  .sha{color:var(--prog)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  footer{margin-top:30px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DataViewer Enterprise — Sprint Tracker
      <small id="sprint"></small>
      <small class="prev" id="prevSprint"></small>
    </h1>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <h2>At a glance</h2>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Workstreams</h2>
    <div class="grid ws" id="ws"></div>
  </section>

  <section>
    <h2>Work-item task panels</h2>
    <div class="grid" id="taskPanels"></div>
  </section>

  <section>
    <h2>Work items (Plane)</h2>
    <div class="grid issues" id="issues"></div>
  </section>

  <section>
    <h2>Recent commits</h2>
    <div class="card commits" style="display:block" id="commits"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const COLORS={done:'var(--done)',ready:'var(--ready)',in_progress:'var(--prog)',todo:'var(--todo)',backlog:'var(--back)',resolved:'var(--resolved)',blocked:'var(--blocked)'};
const LABEL={done:'Done',ready:'Ready for release',in_progress:'In progress',todo:'To do',backlog:'Backlog',resolved:'Resolved',blocked:'Blocked'};
function pill(s){const c=COLORS[s]||'var(--back)';return `<span class="pill" style="background:${c}22;color:${c}">${LABEL[s]||s}</span>`;}

const DATA = {
  sprint: "v2.9 (internal v2.8.x -> v2.9.0 deployable) · DV-21 mobile form + DV-23 NOTIFY storm",
  branch: "feature/v2.9 (off main @ 20bedf4 = v2.8.0)",
  prevSprint: "v2.8.0 - quick wins + TPM plot/notes (DV-19/20/24/18/22), shipped + tagged 2026-07-14.",
  lastUpdated: "2026-07-15 - DV-21 DONE, owner-signed-off and live on the NAS: 24h local-history drawer, single-file review page (Title·Tester·Round sticky header + prev/next + dual-level delete), desktop-matching dark radar (no-yellow palette, tilted labels, hi-DPI), and in-progress form-draft persistence (24h TTL, resubmit-safe). All browser-verified with real page reloads (Node 5/0, pytest 9 passed / 19 skipped). Web files pushed on feature/v2.9 (b6d4f2f); NOT merged to main - they ride the branch to v2.9.0 when DV-23 also lands. Now starting DV-23 (NOTIFY storm): code investigation only so far - the live-DB confirmation step needs owner approval.",
  workstreams: [
    {name:"Phase 3 - Mobile sensory form (DV-21)", status:"done", note:"DONE + owner-signed-off, deployed live on the NAS (owner deploys deploy/sensory-collect). 24h local history drawer, single-file review page (sticky header + prev/next + dual delete), dark desktop-matching radar, resubmit-safe form-draft persistence. Core /submit + app.py + DB untouched. Node 5/0, pytest 9/19-skip. Latest web build b6d4f2f - not merged to main yet (rides the branch to v2.9.0).", ids:["DV-21"]},
    {name:"Phase 4 - NOTIFY storm (DV-23)", status:"in_progress", note:"STARTED 2026-07-15. An unidentified client updates sensory_sessions id=1418 ~1/sec, firing a continuous NOTIFY stream. Investigating the source (stuck desktop? LiveSync retry loop? presence/heartbeat timer? a no-op UPDATE bumping updated_at?) and fixing at source so NOTIFY only fires on real edits. Rides the v2.9 desktop installer. Live-DB confirmation is owner-gated.", ids:["DV-23"]},
  ],
  taskPanels: [
    {title:"Phase 3 - Mobile sensory form", id:"DV-21", tasks:[
      {n:1, name:"Design + plan: localStorage-only 24h history (no DB read endpoint -> anonymous endpoint still can't enumerate the catalog)", status:"done"},
      {n:2, name:"sensory_history.js - pure prune/group/color/radar-geometry module + Node tests (5/0)", status:"done"},
      {n:3, name:"sensory_ui.js - slide-out drawer, single-file review page, prev/next, per-sample + per-file delete", status:"done"},
      {n:4, name:"sensory_plot.js - desktop-matching dark radar: single-file, no-yellow palette, white outlined + tilted labels, hi-DPI", status:"done"},
      {n:5, name:"Review title Title·Tester·Round + sticky Sample/Assessor/Media/Puff header", status:"done"},
      {n:6, name:"sensory_draft.js - in-progress form-draft persistence (24h TTL, restore-on-load, resubmit-safe, stopwatch-persist)", status:"done"},
      {n:7, name:"Verified end-to-end in local Flask browser (real reloads); Node 5/0, pytest 9 passed / 19 skipped; core-untouched guard", status:"done"},
      {n:8, name:"Owner-deployed to NAS + phone signed-off -> Done in Plane", status:"done"},
    ]},
    {title:"Phase 4 - NOTIFY storm", id:"DV-23", tasks:[
      {n:1, name:"Read the write+NOTIFY path (LiveSync.cpp / LiveSyncWorker.cpp, presence/heartbeat timers, OCC updated_at bump) to find the ~1/sec writer", status:"in_progress"},
      {n:2, name:"Pin the id=1418 self-update source + whether it's a real change or a no-op UPDATE that still NOTIFYs", status:"todo"},
      {n:3, name:"(owner-gated) live-DB observation to confirm the storm + its source", status:"todo"},
      {n:4, name:"Fix at source: skip no-op updates / debounce / fix the loop so NOTIFY only fires on genuine edits", status:"todo"},
      {n:5, name:"Add a 'no-op save does not NOTIFY' test", status:"todo"},
      {n:6, name:"Build + full suite green + -Werror clean + internal installer", status:"todo"},
    ]},
  ],
  issues: [
    {id:"DV-21",title:"Mobile sensory form refinements",status:"done",note:"Phase 3 (v2.9) DONE + owner-signed-off, live on the NAS. 24h local history, single-file review page (Title·Tester·Round sticky header, prev/next, dual delete), dark desktop-matching radar (no-yellow, tilted labels, hi-DPI), resubmit-safe in-progress form-draft persistence. Web-only (no installer); code on feature/v2.9 (b6d4f2f), rides to main at v2.9.0."},
    {id:"DV-23",title:"NOTIFY storm - sensory_sessions id=1418 updated ~1/sec",status:"in_progress",note:"Phase 4 (v2.9), STARTED. Find the client + stop spurious no-op writes so NOTIFY only fires on real edits; add a no-op-doesn't-notify test. Likely areas: LiveSync write/NOTIFY path, presence/heartbeat timers, the OCC updated_at bump. Live-DB confirmation owner-gated. Rides the v2.9 desktop installer."},
  ],
  commits: [
    {sha:"61088d6", msg:"docs(v2.9): DV-21 owner sign-off (Done); DV-23 kicked off (In Progress)"},
    {sha:"b6d4f2f", msg:"fix(DV-21): stopwatch-filled puff length persists to the form draft"},
    {sha:"a4f5324", msg:"feat(DV-21): persist in-progress form draft (24h) + sticky review header"},
    {sha:"594b19e", msg:"fix(DV-21): review-page title shows Title . Tester . Round"},
    {sha:"cbdd773", msg:"fix(DV-21): single-file plot (drop drawer checkboxes) + hi-DPI crisp canvas"},
    {sha:"a74b98d", msg:"fix(DV-21): tilt Burnt Taste/Smoothness plot labels to the pentagon edge"},
    {sha:"27c31aa", msg:"fix(DV-21): wide no-yellow high-contrast palette + white outlined plot labels"},
    {sha:"a0df348", msg:"fix(DV-21): dark-theme the radar + inline it in the review page"},
    {sha:"672424f", msg:"fix(DV-21): separate review page from the form; fix Plot button"},
    {sha:"9b438c8", msg:"fix(DV-21): center hamburger; side-menu per-file filter + per-sample legend"},
    {sha:"a10ea97", msg:"feat(DV-21): overlay plot page + desktop-matching canvas radar"},
    {sha:"3f7330d", msg:"feat(DV-21): history storage, drawer, read-only viewer, prev/next, dual delete"},
    {sha:"a54cc05", msg:"feat(DV-21): form.html scaffolding (drawer, viewer, nav, plot overlay) + render test"},
    {sha:"3c22bfd", msg:"feat(DV-21): pure history/color/radar-geometry module + Node tests"},
    {sha:"14372b4", msg:"docs(DV-21): Phase 3 implementation plan"},
    {sha:"58ca511", msg:"docs(DV-21): Phase 3 design spec for mobile sensory form refinements"},
    {sha:"fe391b8", msg:"docs: add v2.9 sprint kickoff handoff (DV-21 mobile form + DV-23 NOTIFY storm)"},
  ],
};

function render(){
  document.getElementById('sprint').textContent = DATA.sprint + "  ·  " + DATA.branch;
  const prevEl = document.getElementById('prevSprint');
  if (DATA.prevSprint) { prevEl.textContent = "Previous: " + DATA.prevSprint; prevEl.style.display = ''; }
  else { prevEl.style.display = 'none'; }
  document.getElementById('meta').innerHTML =
    `<b>Updated</b> ${DATA.lastUpdated}<br><span id="ago"></span>`;

  const all=[...DATA.issues];
  const c=(s)=>all.filter(i=>i.status===s).length;
  const doneN = c('done')+c('ready');
  document.getElementById('stats').innerHTML = [
    ['Done / ready', doneN, 'var(--done)'],
    ['In progress', c('in_progress'), 'var(--prog)'],
    ['To do', c('todo'), 'var(--todo)'],
    ['Backlog', c('backlog'), 'var(--back)'],
    ['Task-panel items', (()=>{const a=DATA.taskPanels.flatMap(p=>p.tasks);return a.filter(t=>t.status==='done').length+' / '+a.length;})(), 'var(--prog)'],
  ].map(([l,n,col])=>`<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('legend').innerHTML = Object.keys(LABEL).map(k=>
    `<span><i class="dot" style="background:${COLORS[k]}"></i>${LABEL[k]}</span>`).join('');

  document.getElementById('ws').innerHTML = DATA.workstreams.map(w=>
    `<div class="card"><div class="body"><div class="t">${w.name}</div><div class="n">${w.note}</div>
     <div class="ids">${w.ids.map(i=>`<span class="id">${i}</span>`).join('')}</div></div>${pill(w.status)}</div>`).join('');

  document.getElementById('taskPanels').innerHTML = DATA.taskPanels.map(p=>{
    const done = p.tasks.filter(t=>t.status==='done').length;
    const pct  = Math.round(100*done/p.tasks.length);
    const rows = p.tasks.map(t=>
      `<tr><td class="num">${t.n}</td><td class="nm">${t.name}</td><td style="text-align:right">${pill(t.status)}</td></tr>`).join('');
    return `<div class="card" style="display:block">
      <div class="t" style="margin-bottom:8px">${p.title} <span class="id">${p.id}</span>`+
      `<span style="float:right;color:var(--mut);font-weight:400">${done}/${p.tasks.length}</span></div>
      <div class="bar" style="margin:0 0 12px"><i style="width:${pct}%"></i></div>
      <table class="tasks"><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  document.getElementById('issues').innerHTML = DATA.issues.map(i=>
    `<div class="card"><div class="body"><div class="t"><span class="id">${i.id}</span> ${i.title}</div>
     <div class="n">${i.note}</div></div>${pill(i.status)}</div>`).join('');

  document.getElementById('commits').innerHTML = DATA.commits.map(c=>
    `<div class="row"><span class="sha">${c.sha}</span><span>${c.msg}</span></div>`).join('');

  document.getElementById('foot').innerHTML =
    'Snapshot regenerated by Claude Code after each completed task. Not auto-live — reload after a progress update. ' +
    'States mirror Plane + the local feature branch (not yet pushed / deployed).';

  const t0=Date.now();
  setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);
    document.getElementById('ago').textContent = 'page open '+ (s<60? s+'s': Math.floor(s/60)+'m')+' ago';},1000);
}
render();
</script>
</body>
</html>
